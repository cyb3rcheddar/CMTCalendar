<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    /**
     * DESIGN SYSTEM CMT MUSICAL
     * Colori istituzionali: Verde foresta + Rosa pop
     * Mobile-first responsive design
     */
    :root {
      --primary-color: #2d6a4f;    /* Verde Foresta CMT */
      --primary-dark: #1b4332;     /* Verde Molto Scuro per titoli e gerarchie */
      --accent-color: #ff85a2;     /* Rosa Pop CMT per elementi di contrasto */
      --accent-dark: #f72585;      /* Rosa più carico per focus e stati attivi */
      --bg-color: #f4f9f4;         /* Sfondo chiarissimo con una punta di verde */
      --card-bg: #ffffff;
      --text-dark: #2d3748;
      --text-muted: #718096;
      --border-color: #d8f3dc;     /* Bordi verde chiarissimo */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 960px;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: var(--bg-color);
      color: var(--text-dark);
      margin: 0 auto;
    }

    /* Intestazione con Logo */
    .header-container {
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    .logo {
      max-width: 120px;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(45, 106, 79, 0.2);
      margin-bottom: 12px;
      background-color: #fff;
      padding: 5px;
      border: 2px solid var(--accent-color);
    }

    h1 {
      color: var(--primary-dark);
      font-size: 24px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Card styling - contenitore principale per sezioni */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    .card h3 {
      margin-top: 0;
      color: var(--primary-dark);
      font-size: 17px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Input & Form */
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
    }

    /* Pulsanti standard */
    button {
      background: var(--primary-color);
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      line-height: 1.35;
      min-height: 48px;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Pulsante rosa per azioni di conferma */
    .btn-conferma {
      background: var(--accent-color);
      color: var(--primary-dark);
    }

    /* Box Allievi / Famiglie - Liste membri */
    .membro-box {
      background: #f7faf8;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .membro-nome {
      font-weight: bold;
      color: var(--primary-dark);
      font-size: 15px;
    }

    /* Badge per codici corsi */
    .corso-badge {
      display: inline-block;
      background: var(--border-color);
      color: var(--primary-dark);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin: 4px 4px 0 0;
      font-weight: bold;
    }

    /* Badge per lo stato BOZZA (visibile solo a staff) */
    .badge-bozza {
      background: #ffe3e8 !important;
      color: var(--accent-dark) !important;
      border: 1px solid var(--accent-color);
    }

    /* Card singolo evento calendario */
    .prova {
      border-left: 6px solid var(--primary-color);
      padding: 15px;
      margin: 15px 0;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border-radius: 0 12px 12px 0;
      position: relative;
    }

    /* Lista di chi partecipa al turno */
    .partecipanti-list {
      margin-top: 10px;
      font-size: 13px;
      background: #fff0f3; /* Sfumatura rosa leggera */
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--accent-color);
    }

    /* Notifica Alert per aggiornamenti calendario */
    .alert {
      background: #fff0f3;
      padding: 15px;
      border-radius: 12px;
      border-left: 6px solid var(--accent-color);
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Classe utility per nascondere elementi */
    .nascosto {
      display: none;
    }

    #errore {
      color: var(--accent-dark);
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
    }

    .prova,
    .partecipanti-list,
    .membro-box,
    #ruolo {
      overflow-wrap: anywhere;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        background: var(--primary-dark);
      }

      .btn-conferma:hover {
        background: var(--accent-dark);
        color: white;
      }
    }

    @media (max-width: 768px) {
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        min-width: 0;
        padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .card,
      .card * {
        min-width: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      .header-container {
        margin-bottom: 18px;
        padding-top: 4px;
      }

      .logo {
        max-width: 96px;
      }

      h1 {
        font-size: 22px;
      }

      .card {
        padding: 16px;
        margin-bottom: 16px;
        border-radius: 14px;
      }

      .card h3 {
        font-size: 16px;
      }

      input,
      textarea,
      select {
        font-size: 16px;
      }

      .prova {
        padding: 12px;
        margin: 12px 0;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 13px;
      }

      .prova {
        padding: 10px;
      }

      .corso-badge {
        padding: 4px 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      button:active {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <!-- INTESTAZIONE PORTALE CON LOGO -->
  <div class="header-container">
    <!-- Puoi inserire qui il link reale del logo dell'associazione -->
    <img id="logo" class="logo" src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&q=80&w=150&h=150" alt="CMT Musical Logo" onerror="this.src='https://placehold.co/150x150/2d6a4f/ffffff?text=CMT'">
    <h1>CMT Musical</h1>
    <div class="subtitle">Portale Allievi & Staff</div>
  </div>

  <!-- BOX LOGIN - Primo step (inizialmente visibile) -->
  <div id="loginBox" class="card">
    <h3>🔑 Accedi al Portale</h3>
    <input type="email" id="email" placeholder="Inserisci la tua email registrata">
    <button onclick="login()">Accedi</button>
    <div id="errore"></div>
  </div>

  <!-- CONTENUTO DEL PORTALE - Visibile dopo login (inizialmente nascosto) -->
  <div id="contenuto" class="nascosto">

    <!-- Sezione Profilo Utente e Allievi Famiglia -->
    <div class="card">
      <h3 id="utenteNome">👤 Benvenuto</h3>
      <div id="ruolo" style="font-weight: bold; color: var(--primary-color); margin-bottom: 12px; font-size: 15px;"></div>
      <div id="allieviFamiglia"></div>  <!-- Lista allievi per famiglie (vuota per staff) -->
    </div>

    <!-- Sezione Caricamento Materiale (Visibile SOLO a Docenti o Amministratore) -->
    <div id="sezioneCaricamento" class="card nascosto">
      <h3>📤 Carica Materiale Didattico</h3>
      <label style="font-size: 12px; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 5px;">Seleziona Corso:</label>
      <select id="caricaCorso"></select>
      
      <input type="text" id="caricaTitolo" placeholder="Titolo del File (es. Base Musicale Atto I)">
      <textarea id="caricaDesc" placeholder="Breve descrizione o note per gli allievi" rows="2"></textarea>
      <input type="text" id="caricaLink" placeholder="Link di Condivisione Google Drive">
      
      <button onclick="salvaMateriale()">Invia e Condividi con Allievi</button>
      <div id="caricaMessaggio" style="margin-top: 12px; font-size: 13px; font-weight: bold;"></div>
    </div>

    <!-- Calendario Prove e Turni -->
    <div class="card">
      <h3>📅 Calendario Prove</h3>
      <div id="calendario"></div>     <!-- Lista turni -->
    </div>

    <!-- Box presa visione: visibile solo con una nuova versione o dopo la conferma nella sessione -->
    <div id="aggiornamenti" class="card nascosto"></div>

  </div>

  <script>
    // ============================================================
    // STATO GLOBALE DEL PORTALE
    // ============================================================
    let emailUtente = "";  // Cache: email utente loggato
    let datiPortale = null;  // Cache: oggetto state completo dal backend

    /**
     * AUTENTICAZIONE UTENTE - Entry point
     * Invia email al backend (main.gs) via google.script.run.caricaPortale(email)
     * Backend valida accesso e ritorna profilo completo
     */
    function login() {
      emailUtente = document.getElementById("email").value.trim().toLowerCase();

      if (!emailUtente) {
        document.getElementById("errore").innerHTML = "Inserisci una email valida";
        return;
      }

      // Mostra feedback durante elaborazione
      document.getElementById("errore").innerHTML = "Verifica credenziali in corso...";

      // Chiama backend (main.gs) in modo asincrono
      google.script.run
        .withSuccessHandler(mostraPortale)  // Callback: autenticazione riuscita
        .withFailureHandler(function(e) {   // Callback: errore connessione
          document.getElementById("errore").innerHTML = "Errore di connessione: " + e.message;
        })
        .caricaPortale(emailUtente);  // Invia email per validazione
    }

    /**
     * RENDERING PORTALE - Mostra interfaccia in base al tipo utente
     * Differenzia tra:
     * - STAFF: mostra sezione caricamento materiale
     * - FAMIGLIA: mostra lista allievi e loro corsi
     * 
     * @param {Object} dati - Risposta dal backend con profilo utente
     */
    function mostraPortale(dati) {
      if (dati.errore) {
        // Autenticazione fallita - mostra errore
        document.getElementById("errore").innerHTML = dati.messaggio;
        return;
      }

      // Salva stato in cache globale
      datiPortale = dati;

      // Nascondi login box, mostra portale principale
      document.getElementById("loginBox").classList.add("nascosto");
      document.getElementById("contenuto").classList.remove("nascosto");

      // Imposta intestazione profilo
      document.getElementById("utenteNome").innerHTML = "👤 " + dati.utente.nome;
      
      if (dati.utente.tipo === "staff") {
        // PROFILO STAFF
        document.getElementById("ruolo").innerHTML = "Ruolo Staff: " + dati.utente.ruolo;
        document.getElementById("allieviFamiglia").innerHTML = "";  // Staff non ha allievi associati
        
        // Abilita sezione caricamento se staff ha permesso "puoCaricare"
        // (Docenti e Admin possono caricare)
        if (dati.utente.puoCaricare) {
          document.getElementById("sezioneCaricamento").classList.remove("nascosto");
          popolaSelettoreCorsi(dati.corsiVisualizzati);
        }
      } else {
        // PROFILO FAMIGLIA O INDIVIDUALE
        if (dati.utente.anteprimaAttiva) {
          // Docente in "Anteprima Famiglia" - visualizzazione read-only
          document.getElementById("ruolo").innerHTML = "Visualizzazione: Anteprima Famiglia (Sola Lettura)";
        } else if (dati.utente.tipo === "individuale") {
          document.getElementById("ruolo").innerHTML = "Profilo: Individuale";
        } else {
          document.getElementById("ruolo").innerHTML = "Profilo: Famiglia";
        }
        // Nasconde form caricamento per famiglie
        document.getElementById("sezioneCaricamento").classList.add("nascosto");
        // Mostra lista allievi della famiglia
        mostraAllievi(dati.utente);
      }

      // Popola sezioni dinamiche
      mostraAggiornamenti(dati);
      mostraCalendario(dati.prove);
    }

    /**
     * POPOLA SELECT CORSI - Dropdown per docenti/admin
     * Permette di scegliere il corso per il caricamento materiale
     * 
     * @param {Array} corsi - Array di {id, nome} corsi assegnati
     */
    function popolaSelettoreCorsi(corsi) {
      let select = document.getElementById("caricaCorso");
      select.innerHTML = "";
      
      if (!corsi || corsi.length === 0) {
        select.innerHTML = "<option value=''>Nessun corso attivo associato</option>";
        return;
      }

      // Crea option per ogni corso
      corsi.forEach(function(c) {
        let opt = document.createElement("option");
        opt.value = c.id;
        opt.innerText = c.nome + " (" + c.id + ")";  // Nome descrittivo + ID
        select.appendChild(opt);
      });
    }

    /**
     * SALVA MATERIALE DIDATTICO - Upload file per docenti
     * Valida form, invia al backend, ricarica lista materiali
     * Callback: google.script.run.salvaNuovoMateriale()
     */
    function salvaMateriale() {
      let corso = document.getElementById("caricaCorso").value;
      let titolo = document.getElementById("caricaTitolo").value.trim();
      let desc = document.getElementById("caricaDesc").value.trim();
      let link = document.getElementById("caricaLink").value.trim();
      let msg = document.getElementById("caricaMessaggio");

      // Validazione form
      if (!corso || !titolo || !link) {
        msg.style.color = "var(--accent-dark)";
        msg.innerHTML = "❌ Compila Corso, Titolo e inserisci un Link Drive.";
        return;
      }

      // Feedback caricamento
      msg.style.color = "var(--primary-color)";
      msg.innerHTML = "Salvataggio nel database CMT in corso...";

      // Invia al backend
      google.script.run
        .withSuccessHandler(function(risultato) {
          if (risultato.errore) {
            // Errore salvataggio
            msg.style.color = "var(--accent-dark)";
            msg.innerHTML = "❌ " + risultato.messaggio;
          } else {
            // Successo
            msg.style.color = "var(--primary-color)";
            msg.innerHTML = "✅ " + risultato.messaggio;
            
            // Pulisci form
            document.getElementById("caricaTitolo").value = "";
            document.getElementById("caricaDesc").value = "";
            document.getElementById("caricaLink").value = "";
            
          }
        })
        .salvaNuovoMateriale(corso, titolo, desc, link);
    }

    /**
     * MOSTRA ALLIEVI - Famiglia
     * Renderizza lista di allievi del gruppo e i loro corsi
     * 
     * @param {Object} utente - Oggetto utente con proprietà .membri
     */
    function mostraAllievi(utente) {
      let box = document.getElementById("allieviFamiglia");
      box.innerHTML = "";

      if (utente.membri && utente.membri.length > 0) {
        let html = "<p style='margin:0 0 10px 0; font-size:13px; color:var(--text-muted); font-weight: 500;'>Allievi iscritti:</p>";
        
        // Itera su ogni allievato
        utente.membri.forEach(function(membro) {
          html += "<div class='membro-box'>";
          html += "<div class='membro-nome'>🎭 " + membro.nome + " " + membro.cognome + "</div>";
          html += "<div style='margin-top:5px;'>";
          
          // Mostra badge corsi per questo allievato
          if(membro.corsi && membro.corsi.length > 0) {
            membro.corsi.forEach(function(c) {
              html += "<span class='corso-badge'>" + c + "</span>";
            });
          } else {
            html += "<span style='font-size:11px; color:var(--text-muted);'>Nessun corso attivo assegnato</span>";
          }
          
          html += "</div></div>";
        });
        box.innerHTML = html;
      }
    }

    /**
     * MOSTRA NOTIFICHE AGGIORNAMENTI
     * Se dati.aggiornamenti=true, mostra alert rosso con pulsante "Ho letto e preso visione"
     * Chiama confermaVisione() per segnare come letto
     * 
     * @param {Object} dati - State portale dal backend
     */
    function mostraAggiornamenti(dati) {
      let box = document.getElementById("aggiornamenti");
      if (!box) return;

      if (dati.aggiornamenti) {
        // Nuovo aggiornamento disponibile
        box.classList.remove("nascosto");
        box.innerHTML = 
          "<div class='alert'>" +
          "🔔 <b>Nuovo aggiornamento disponibile!</b><br>" +
          "Calendario aggiornato alla versione: v" + dati.versione + "<br><br>" +
          "<button class='btn-conferma' onclick='confermaVisione()'>✅ Ho letto e preso visione</button>" +
          "</div>";
      } else {
        box.innerHTML = "";
        box.classList.add("nascosto");
      }
    }

    /**
     * CONFERMA VISIONE AGGIORNAMENTO
     * Marca nella traccia che l'utente ha visto la nuova versione
     * Chiama google.script.run.confermaVisione(email)
     * Aggiorna l'avviso senza ricaricare la sidebar
     */
    function confermaVisione() {
      let box = document.getElementById("aggiornamenti");
      let pulsante = box ? box.querySelector("button") : null;

      if (pulsante) {
        pulsante.disabled = true;
        pulsante.innerText = "Registrazione in corso...";
      }

      google.script.run
        .withSuccessHandler(function() {
          if (box) {
            box.innerHTML = "<div class='alert'>✅ Presa visione registrata correttamente.</div>";
          }
        })
        .withFailureHandler(function(e) {
          if (pulsante) {
            pulsante.disabled = false;
            pulsante.innerText = "✅ Ho letto e preso visione";
          }
          if (box) {
            box.insertAdjacentHTML("beforeend", "<p id='errorePresaVisione' style='color:var(--accent-dark); font-size:13px;'>Errore nella registrazione: " + e.message + "</p>");
          }
        })
        .confermaVisione(emailUtente);
    }

    /**
    * MOSTRA CALENDARIO - Renderizza lista prove e turni
     * Differenzia tra:
     * - STAFF: vede tutti i turni (BOZZA ha badge rosso, PUBBLICATO normal)
     * - FAMIGLIA: vede solo PUBBLICATO e mostra chi dei loro figli partecipa
     * 
     * Ogni turno ha:
     * - Data, Orario, Attività descrittiva
     * - Badge BOZZA se non pubblicato (solo staff)
     * - Lista partecipanti (figli per famiglia, destinatari per staff)
     * - Pulsante per salvare in Google Calendar
     * 
     * @param {Array} prove - Array di turni [{data, orario, cosa, destinatari, stato, note}]
     */
    function mostraCalendario(prove) {
      let html = "";
      if (!prove || prove.length == 0) {
        html = "<p style='color:var(--text-muted); font-size: 14px;'>Nessun turno o prova pianificata a calendario.</p>";
      } else {
        prove.forEach(function(p) {
          let chiDeveAndare = [];  // Figli della famiglia che partecipano
          
          // Per famiglie: identifica quali figli partecipano al turno
          if (datiPortale.utente.tipo === "famiglia" && datiPortale.utente.membri) {
            datiPortale.utente.membri.forEach(function(membro) {
              // Controlla se almeno uno dei corsi del figlio è nel turno
              let partecipa = membro.corsi.some(function(corsoCodice) {
                return p.destinatari.includes(corsoCodice);
              });
              
              if (partecipa) {
                chiDeveAndare.push(membro.nome);
              }
            });
          }

          // Identifica se turno è in BOZZA
          let èBozza = p.stato === "BOZZA";

          // Renderizza card singolo turno
          html += 
            "<div class='prova' style='" + (èBozza ? "border-left-color: var(--accent-color);" : "") + "'>" +
            "<span style='font-size: 17px; font-weight: bold; color: " + (èBozza ? "var(--accent-dark)" : "var(--primary-dark)") + ";'>📅 " + p.data + "</span>";

          // Badge BOZZA (visibile solo a staff)
          if (èBozza) {
            html += " <span class='corso-badge badge-bozza'>BOZZA INTERNA</span>";
          }

          // Dettagli turno
          html += "<br><div style='margin-top:5px; font-size: 14px; line-height: 1.5;'>" +
                  "<b>🕒 Orario:</b> " + p.orario + "<br>" +
                  "<b>🎭 Attività:</b> " + p.cosa + "<br>";

          if (p.note) {
            html += "<b>📝 Note:</b> <span style='color:var(--primary-color); font-weight: 500;'>" + p.note + "</span><br>";
          }
          
          html += "</div>";

          // Mostra chi partecipa
          if (chiDeveAndare.length > 0) {
            // Famiglia: mostra i loro figli
            html += 
              "<div class='partecipanti-list'>" +
              "👉 <b>Chi partecipa:</b> " + chiDeveAndare.join(", ") +
              "</div>";
          } else if (datiPortale.utente.vedeTutto) {
            // Staff con vedeTutto: mostra destinatari del turno
            html += 
              "<div class='partecipanti-list' style='background:#f4f9f4; border-color:var(--border-color);'>" +
              "👥 <b>Destinatari del turno:</b> " + p.destinatari.join(", ") +
              "</div>";
          }

          // Pulsante Google Calendar
          html += 
            "<button style='margin-top:12px; font-size:11px; padding:8px;' onclick=\"aggiungiCalendar('" + p.data + "','" + p.orario + "','" + String(p.cosa).replace(/'/g, "\\'") + "')\">" +
            "📅 Salva nel mio Google Calendar" +
            "</button>" +
            "</div>";
        });
      }
      document.getElementById("calendario").innerHTML = html;
    }

    /**
     * APRI GOOGLE CALENDAR - Crea link per aggiungere evento
     * Usa URL pubblico di Google Calendar con parametri
     * - action=TEMPLATE: crea nuovo evento
     * - text: titolo evento (URL encoded)
     * - dates: intervallo orario in formato iCal
     * 
     * @param {string} data - Data in formato "GG/MM/AAAA"
     * @param {string} orario - Orario in formato "HH:MM - HH:MM"
     * @param {string} titolo - Nome evento
     */
    function aggiungiCalendar(data, orario, titolo) {
      let testo = encodeURIComponent(titolo);
      let url = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
        "&text=" + testo +
        "&dates=" + creaDataGoogle(data, orario);

      window.open(url, "_blank");  // Apri in nuova tab
    }

    /**
     * CONVERTE DATA E ORARIO - Formato per Google Calendar
     * Converte da formato italiano "29/08/2026 14:30-15:30"
     * A formato iCal "20260829T143000/20260829T153000"
     * 
     * @param {string} data - Data in formato "GG/MM/AAAA"
     * @param {string} orario - Orario in formato "HH:MM - HH:MM"
     * @returns {string} Intervallo iCal "INIZIO/FINE"
     */
    function creaDataGoogle(data, orario) {
      try {
        let parti = data.split("/");
        let giorno = parti[0];
        let mese = parti[1];
        let anno = parti[2];

        // Estrai ore/minuti da "HH:MM - HH:MM"
        let ora = orario.split("-")[0].trim();
        let fine = orario.split("-")[1].trim();

        let h1 = ora.split(":")[0];
        let m1 = ora.split(":")[1];

        let h2 = fine.split(":")[0];
        let m2 = fine.split(":")[1];

        // Formato iCal: YYYYMMDDTHHMMSS
        let inizio = anno + mese + giorno + "T" + h1 + m1 + "00";
        let fineEvento = anno + mese + giorno + "T" + h2 + m2 + "00";

        return (inizio + "/" + fineEvento);
      } catch (e) {
        // Se parsing fallisce, ritorna vuoto
        return "";
      }
    }
  </script>
